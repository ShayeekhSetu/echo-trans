<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Echocardiography Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5f8; --card:#fff; --ink:#1b2430; --mute:#64707d; --line:#dde3ea;
  --pri:#0b5c8a; --pri2:#e6f1f8; --abn:#fff4e5; --abnb:#f0a43a; --red:#c62828; --ok:#2e7d32;
}
*{box-sizing:border-box}
html,body{-webkit-text-size-adjust:100%;text-size-adjust:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Hind Siliguri",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:var(--pri);color:#fff;padding:8px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.top h1{font-size:16px;margin:0;font-weight:600;flex:1;min-width:160px;line-height:1.2}
.top h1 small{display:block;font-weight:400;opacity:.8;font-size:12px}
.tb{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:6px 10px;font-size:14px;white-space:nowrap}
.tb.hl{background:#fff;color:var(--pri);font-weight:600}
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;padding:10px 4px;font-size:14px;color:var(--mute);border-bottom:3px solid transparent}
.tabs button.on{color:var(--pri);border-bottom-color:var(--pri);font-weight:600}
.wrap{display:block}
.pane{display:none;padding:10px}
.pane.on{display:block}
@media (min-width:1100px){
  .tabs{display:none}
  .wrap{display:grid;grid-template-columns:minmax(460px,560px) 1fr;gap:0;height:calc(100vh - 54px)}
  #pForm,#pPrev{display:block;overflow:auto;height:100%}
  #pPrev{background:#d9dee5}
  #pSaved.on,#pSet.on{position:fixed;inset:54px 0 0 0;z-index:30;background:var(--bg);overflow:auto}
  .wrap.side #pSaved,.wrap.side #pSet{display:none}
}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.card h3{margin:0 0 8px;font-size:15px;color:var(--pri);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sp{flex:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;font-size:12.5px;color:var(--mute);gap:2px}
label.f input,label.f select,label.f textarea{font-size:15px;color:var(--ink);padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;width:100%}
textarea{resize:vertical}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.seg button{flex:1;border:0;background:#fff;padding:8px 4px;font-size:13.5px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--pri);color:#fff;font-weight:600}
.mini{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 9px;font-size:13px}
.mini.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.mini.warn{color:var(--red);border-color:#f2b8b8}
.vrow{border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:#fff}
.vrow.abn{background:var(--abn);border-color:var(--abnb)}
.vrow.off{opacity:.5}
.vh{display:flex;align-items:center;gap:6px;padding:5px 8px;flex-wrap:wrap}
.vh .nm{font-weight:700;min-width:84px;display:flex;align-items:center;gap:5px;font-size:14px}
.vh select,.vh input[type=text]{padding:5px 6px;border:1px solid var(--line);border-radius:7px;font-size:14px;background:#fff}
.vh .psv{width:58px;text-align:center}
.vh .u{font-size:11px;color:var(--mute);margin-left:-3px}
.vh .chk{display:flex;align-items:center;gap:4px;font-size:13px;white-space:nowrap}
.vh .grow{flex:1}
.vh .xp{border:1px solid var(--line);background:#fff;border-radius:7px;width:32px;height:30px;font-size:14px}
.vs{padding:0 10px 6px;font-size:12.5px;color:var(--mute)}
.vs.ok{display:none}
.vh.v2{padding-top:0}
.nfc{background:#fdecec;border-radius:7px;padding:4px 8px;color:var(--red)}
@media (max-width:1099px){#bSaved,#bSet{display:none}}
.vs b{color:#a1580a}
.vd{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px 8px 10px}
.vd[hidden]{display:none}
.vd label{display:flex;flex-direction:column;font-size:11.5px;color:var(--mute)}
.vd select,.vd input{padding:5px 6px;border:1px solid var(--line);border-radius:7px;font-size:14px;color:var(--ink);background:#fff}
.vvt{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.vvh,.vvr{display:grid;grid-template-columns:1.6fr .8fr .8fr 1.1fr .7fr;gap:4px;align-items:center;padding:4px 6px}
.vvh{background:var(--pri2);font-size:11.5px;font-weight:600;color:var(--pri)}
.vvr{border-top:1px solid var(--line);font-size:12.5px}
.vvr.abn{background:var(--abn)}
.vvr input,.vvr select,.vvp input,.vvp select{width:100%;min-width:0;padding:5px 4px;border:1px solid var(--line);border-radius:6px;font-size:14px;background:#fff}
.vvp{display:grid;grid-template-columns:1.5fr .7fr 1.5fr;gap:6px;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:4px 10px;font-size:13px}
.chip.on{background:var(--pri2);border-color:var(--pri);color:var(--pri);font-weight:600}
.vg{font-size:12.5px;color:var(--mute);margin:8px 0 4px;font-weight:600}
.hint{font-size:12px;color:var(--mute);margin:4px 0 0}
.ltabs{display:flex;gap:6px;margin-bottom:8px}
.ltabs button{flex:1;padding:8px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:600}
.ltabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#1b2430;color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;z-index:99;opacity:0;transition:opacity .25s;pointer-events:none;max-width:92vw;text-align:center}
.toast.on{opacity:1}
.stat{font-size:12px;opacity:.85}
.srow{display:flex;gap:8px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:6px}
.srow .i{flex:1;min-width:0}
.srow .i b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .i span{font-size:12.5px;color:var(--mute)}
.logoPrev{width:90px;height:70px;border:1px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fff;font-size:12px;color:var(--mute)}
.logoPrev img{max-width:100%;max-height:100%}
#pv{padding:10px 0}
.pgw{margin:0 auto 14px;position:relative;box-shadow:0 2px 12px rgba(0,0,0,.18);background:#fff}
.pgw .pg{transform-origin:0 0;position:absolute;left:0;top:0}
#measure,#cap{position:fixed;left:-20000px;top:0;width:794px;pointer-events:none}
.busy{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:100;color:#fff;font-size:16px}
.busy.on{display:flex}

/* ============ REPORT (A4 @96dpi = 794 x 1123) ============ */
.pg,.pg *{-webkit-text-size-adjust:none;text-size-adjust:none}
.pg{width:794px;height:1123px;padding:30px 36px 26px;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif;font-size:11.77px;line-height:1.3;overflow:hidden;position:relative}
.pgc{width:100%}
.pg .rh{display:flex;align-items:center;gap:14px;border-bottom:2.5px solid #0b5c8a;padding-bottom:6px;min-height:70px}
.pg .lg{width:88px;height:70px;display:flex;align-items:center;justify-content:center;flex:none}
.pg .lg img{max-width:88px;max-height:70px}
.pg .lg.ph{border:1px dashed #b7c2cc;color:#9aa6b1;font-size:10.7px}
.pg .ci{flex:1;text-align:center}
.pg .ci .cn{font-size:22.47px;font-weight:700;color:#0b4f78;letter-spacing:.3px;font-family:Georgia,"Times New Roman",serif}
.pg .ci .ca{font-size:11.24px;color:#333;margin-top:2px;white-space:pre-line}
.pg .ph-t{color:#a7b2bc;font-weight:400;font-style:italic}
.cap .ph-t,.cap .lg.ph{visibility:hidden}
.pg .lgsp{width:88px;flex:none}
.pg .rt{text-align:center;font-weight:700;font-size:13.38px;letter-spacing:.6px;margin:5px 0 4px;color:#0b4f78}
.pg table{width:100%;border-collapse:collapse}
.pg .pt td{padding:1.8px 6px;font-size:11.77px;vertical-align:top}
.pg .ptb{border:1px solid #8a97a3;margin-bottom:4px}
.pg .pt .k{font-weight:700;white-space:nowrap;width:1%}
.pg .ex{text-align:center;font-size:10.17px;font-style:italic;color:#444;margin:2px 0 3px}
.pg .lh{font-weight:700;text-align:center;text-decoration:underline;font-size:12.84px;margin:4px 0 3px;letter-spacing:.4px}
.pg .vt{margin-bottom:4px}
.pg .vt th{background:#e3ebf3;border:1px solid #8a97a3;padding:2px 3px;font-size:10.49px;font-weight:700;line-height:1.15}
.pg .vt td{border:1px solid #8a97a3;padding:1px 3px;font-size:10.49px;text-align:center;line-height:1.18}
.pg .vt td.n{text-align:left;font-weight:700;white-space:nowrap}
.pg .vt td.nf{font-weight:700;letter-spacing:.3px;background:#fbeaea}
.pg .vt td.a{font-weight:700;color:#b3261e}
.pg .vt .cap1{background:#c9d6e3;font-size:10.91px;letter-spacing:.4px;text-align:center}
.pg .sec{margin-top:6px}
.pg .sh{font-weight:700;font-size:12.31px;background:#e3ebf3;border-left:4px solid #0b5c8a;padding:2px 7px;margin:6px 0 4px}
.pg .cm ul{margin:0;padding-left:17px}
.pg .cm li{margin:0;font-size:11.56px;line-height:1.28}
.pg .cm .sub{font-weight:700;margin:3px 0 1px;text-decoration:underline}
.pg .imp{font-weight:700;font-size:12.31px}
.pg .dg{position:relative;width:100%;overflow:hidden;border:1px solid #d0d7de}
.pg .dg img{position:absolute;display:block;max-width:none}
.pg .dg svg{position:absolute;left:0;top:0;width:100%;height:100%}
.pg .lgd{display:flex;gap:12px;font-size:10.17px;color:#333;margin-top:2px;flex-wrap:wrap}
.pg .lgd i{display:inline-block;width:16px;height:4px;vertical-align:middle;margin-right:3px;border-radius:2px}
.pg .lgd i.dot{width:9px;height:9px;border-radius:50%}
.pg .two{display:flex;gap:12px;align-items:flex-start}
.pg .sig{display:flex;justify-content:flex-end;margin-top:10px}
.pg .sig .sb{text-align:right;min-width:260px}
.pg .sig .line{border-top:1px solid #333;margin:22px 0 3px auto;width:200px}
.pg .sig .dn{font-weight:700;font-size:13.38px}
.pg .sig .dd{font-size:11.24px;white-space:pre-line;color:#222}
.pg .abbr{font-size:8.77px;font-style:italic;color:#444;border-top:1px solid #c2cad2;margin-top:8px;padding-top:3px;line-height:1.25}
.pg .pn{position:absolute;bottom:9px;right:36px;font-size:9.63px;color:#777}
.pg .ps{display:flex;justify-content:space-between;gap:10px;border:1px solid #8a97a3;padding:3px 8px;margin:7px 0 8px;font-size:11.77px}
.pg .roomy .vt td{padding:3.2px 4px;font-size:11.77px}
.pg .roomy .vt th{padding:3.5px 3px;font-size:11.34px}
.pg .roomy .vt .cap1{font-size:11.77px}
.pg .roomy .pt td{padding:3px 6px;font-size:12.63px}
.pg .roomy .lh{font-size:13.91px;margin:8px 0 5px}
.pg .roomy .vt{margin-bottom:7px}
.pg .roomy .cm li{font-size:12.84px;line-height:1.4;margin:1px 0}
.pg .roomy .imp{font-size:13.38px}
.pg .roomy .sh{font-size:13.38px;margin:9px 0 5px}
.pg .roomy .abbr{font-size:9.63px}
.pg .sh2{display:flex;justify-content:space-between;border-bottom:2px solid #0b5c8a;padding-bottom:4px;margin-bottom:6px;font-size:11.24px}
.pg .sh2 b{font-size:13.91px;color:#0b4f78;font-family:Georgia,serif}
/* ===== echo additions ===== */
.mt{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.mr{display:grid;grid-template-columns:1fr 74px 44px 74px 16px;gap:6px;align-items:center;padding:4px 8px;border-top:1px solid var(--line);font-size:13.5px}
.mr:first-child{border-top:0}
.mr.abn{background:var(--abn)}
.mr input{width:100%;min-width:0;padding:5px 6px;border:1px solid var(--line);border-radius:7px;font-size:15px;text-align:right;background:#fff}
.mr.calc input{background:var(--pri2);border-color:transparent;color:var(--pri);font-weight:600}
.mr .u{font-size:11.5px;color:var(--mute)}
.mr .nr{font-size:11.5px;color:var(--mute);white-space:nowrap}
.mr .fl{font-weight:700;color:var(--red);text-align:center}
.mr .ml small{color:var(--mute);font-size:10.5px}
@media (max-width:420px){.mr{grid-template-columns:1fr 64px 38px 58px 12px;gap:4px;padding:4px 6px}}
.vcard{border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px;background:#fff}
.vcard.abn{background:var(--abn);border-color:var(--abnb)}
.vcard .vt0{font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.vcard .g3{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.vcard .g3 .full{grid-column:1/-1}
.vcard label{display:flex;flex-direction:column;font-size:11.5px;color:var(--mute)}
.vcard select,.vcard input{padding:6px;border:1px solid var(--line);border-radius:7px;font-size:14px;color:var(--ink);background:#fff;width:100%}
.sug{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;background:#fff7e6;border:1px solid #f3c77a;color:#8a5a00;border-radius:8px;padding:3px 8px;margin-top:6px}
.sug button{border:1px solid #f3c77a;background:#fff;border-radius:6px;padding:2px 8px;font-size:12px}
.frow{display:grid;grid-template-columns:120px 1fr;gap:6px;align-items:center;margin-bottom:6px}
.frow.abn select{border-color:var(--abnb);background:var(--abn)}
.frow b{font-size:13.5px}
.frow .fc{display:flex;flex-direction:column;gap:4px}
.frow select,.frow input{padding:6px;border:1px solid var(--line);border-radius:7px;font-size:14px;background:#fff;width:100%}
@media (max-width:420px){.frow{grid-template-columns:1fr}}

/* report */
.pg .cols2{display:flex;gap:10px;align-items:flex-start}
.pg .cols2>div{flex:1;min-width:0}
.pg .mtb th{background:#e3ebf3;border:1px solid #8a97a3;padding:2.5px 4px;font-size:10.91px;font-weight:700;text-align:left}
.pg .mtb td{border:1px solid #8a97a3;padding:2px 4px;font-size:11.34px}
.pg .mtb td.v{text-align:right;font-weight:600;white-space:nowrap}
.pg .mtb td.v.a{color:#b3261e;font-weight:700}
.pg .mtb td.nr{color:#444;white-space:nowrap;font-size:10.7px}
.pg .mtb .cap1{background:#c9d6e3;font-size:11.13px;letter-spacing:.4px;text-align:center;font-weight:700}
.pg .vlt th{background:#e3ebf3;border:1px solid #8a97a3;padding:2.5px 4px;font-size:10.91px;font-weight:700;text-align:left}
.pg .vlt td{border:1px solid #8a97a3;padding:2px 4px;font-size:11.34px}
.pg .vlt td.n{font-weight:700;white-space:nowrap}
.pg .vlt td.a{color:#b3261e;font-weight:700}
.pg .imp ol{margin:0;padding-left:18px}
.pg .imp li{margin:1px 0}
.pg .roomy .mtb td{padding:3px 5px;font-size:12.2px}
.pg .roomy .mtb th{padding:3.5px 5px;font-size:11.56px}
.pg .roomy .vlt td{padding:3px 5px;font-size:12.2px}
/* doppler valve grid */
.vdh,.vdr{display:grid;grid-template-columns:52px 1fr 1fr 1fr;gap:6px;align-items:start}
.vdh{font-size:11.5px;color:var(--mute);font-weight:600;padding:0 6px 4px}
.vdr{border:1px solid var(--line);border-radius:10px;padding:6px;margin-bottom:6px;background:#fff}
.vdr.abn{background:var(--abn);border-color:var(--abnb)}
.vdr b{padding-top:6px}
.vdr label{display:flex;flex-direction:column;gap:1px}
.vdr input{width:100%;min-width:0;padding:5px 6px;border:1px solid var(--line);border-radius:7px;font-size:15px;text-align:right;background:#fff}
.vdr input.ro{background:var(--pri2);border-color:transparent;color:var(--pri);font-weight:600}
.vdr small{font-size:10.5px;color:var(--mute);text-align:right}
/* wall motion */
.brushes{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.lgi{display:flex;align-items:center;gap:7px;font-size:13px}
.brushes .lgi{border:1px solid var(--line);border-radius:8px;padding:5px 8px;cursor:pointer;background:#fff;user-select:none}
.brushes .lgi.on{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri) inset;font-weight:600}
.lgi i{width:22px;height:14px;border:1px solid #333;flex:none;border-radius:2px}
.bewrap{max-width:380px;margin:4px auto 0;touch-action:manipulation}
.bewrap path:hover,.bewrap circle:hover{opacity:.85}
.wmsum{font-size:13px;background:var(--pri2);border-radius:8px;padding:6px 8px;margin-top:6px;color:var(--pri)}
/* report wall motion */
.pg .wmr{display:flex;gap:14px;align-items:flex-start}
.pg .wmd{width:225px;flex:none}
.pg .wmi{flex:1;min-width:0}
.pg .lgd2{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px}
.pg .lgd2 .lgi{font-size:10.7px;gap:5px}
.pg .lgd2 .lgi i{width:18px;height:11px}
.pg .ent{font-size:10.17px;color:#444}
.pg .dvt th{font-size:10.27px;text-align:center}
.pg .dvt td.nr{text-align:center}
.pg .roomy .wmd{width:250px}
.det{border-top:1px dashed var(--abnb);margin-top:8px;padding-top:8px}
.det .dt{font-weight:700;font-size:13px;color:#8a5a00;margin-bottom:6px}
.det .wkt{background:#fff;border:1px solid var(--abnb);border-radius:6px;padding:1px 8px;margin-left:6px;color:var(--ink)}
.wk{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.wk label{display:flex;flex-direction:column;font-size:11.5px;color:var(--mute)}
.wk select{padding:6px;border:1px solid var(--line);border-radius:7px;font-size:14px;background:#fff}
/* v4 */
.modebar{display:flex;gap:10px;align-items:center;padding:8px 10px}
.badge{font-size:12px;font-weight:700;border-radius:6px;padding:4px 8px;white-space:nowrap}
.badge.dra{background:#fff4e5;color:#a1580a;border:1px solid var(--abnb)}
.badge.fin{background:#e8f5e9;color:var(--ok);border:1px solid #9ccc9f}
.tag{font-size:12px;background:var(--pri2);color:var(--pri);border-radius:6px;padding:2px 8px;font-weight:600}
.efb{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.efb button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 0;font-size:13px}
.efb button.on{background:var(--pri);color:#fff;border-color:var(--pri);font-weight:700}
@media (max-width:420px){.efb{grid-template-columns:repeat(4,1fr)}}
.pedban{background:#eef7ff;border:1px solid #b9dcff;color:#0b4f78;border-radius:8px;padding:6px 8px;font-size:13px}
.cgg label{display:flex;flex-direction:column;font-size:11.5px;color:var(--mute)}
.cgg select,.cgg input{padding:6px;border:1px solid var(--line);border-radius:7px;font-size:14px;background:#fff;width:100%}
.chk-box{background:#fff8e6;border:1px solid var(--abnb);border-radius:8px;padding:8px 10px;font-size:13px}
.chk-box ul{margin:4px 0 0;padding-left:18px}
.chk-box.ok{background:#eef8ef;border-color:#9ccc9f;color:var(--ok)}
.dlg{position:fixed;inset:0;background:rgba(20,28,36,.45);display:none;align-items:center;justify-content:center;z-index:120}
.dlg.on{display:flex}
.dlgc{background:#fff;border-radius:10px;padding:14px;max-width:420px;width:92%;font-size:14px}
.dlgc ul{padding-left:18px;margin:8px 0 12px}
.acbox{position:fixed;z-index:150;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.15);display:none;max-height:240px;overflow:auto}
.acbox div{padding:8px 10px;font-size:14px;border-bottom:1px solid #f0f2f4;cursor:pointer}
.acbox div.on,.acbox div:hover{background:var(--pri2)}
.pg .wmk{position:absolute;left:0;right:0;top:40%;text-align:center;font:700 139.1px/1 Arial;color:rgba(200,30,30,.08);transform:rotate(-28deg);pointer-events:none;z-index:5}
.pg td small{font-weight:400;color:#555;font-size:9.63px}
/* picker */
.pkbox{position:fixed;left:0;right:0;bottom:0;z-index:140;background:#fff;border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(0,0,0,.18);display:none;max-width:640px;margin:0 auto;border-radius:14px 14px 0 0;padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.pkh{display:flex;align-items:center;gap:8px;font-size:13.5px;margin-bottom:6px}
.pkh span{color:var(--mute);flex:1;font-size:12.5px}
.pkx{border:1px solid var(--line);background:#fff;border-radius:8px;width:34px;height:30px}
.pkg{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;max-height:30vh;overflow:auto;padding:2px}
.pkg button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:9px 0;font-size:14px;font-family:inherit}
.pkg button.nor{background:#eef8ef;border-color:#b9dfbb}
.pkg button.cur{background:var(--pri);color:#fff;border-color:var(--pri);font-weight:700}
.pkn{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:5px;margin-top:8px}
.pkn .pkd{grid-row:span 4;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;border:1px dashed var(--line);border-radius:8px;color:var(--pri)}
.pkn button{border:1px solid var(--line);background:#f7f9fb;border-radius:7px;padding:8px 0;font-size:15px}
.pkn button.w{grid-column:span 2}
.pkn button.pri{background:var(--pri);color:#fff;border-color:var(--pri);font-weight:700}
body.pk-open #pForm{padding-bottom:58vh}
@media (min-width:700px){.pkg{grid-template-columns:repeat(10,1fr)}}
/* page-1 layout v2 */
.pg .wmd{width:215px}
.pg .roomy .wmd{width:225px}
.pg .lgdS{margin-top:4px;gap:2px 6px}
.pg .lgdS .lgi{font-size:9.2px;gap:4px}
.pg .lgdS .lgi i{width:13px;height:9px}
.pg .wmi .sec{margin-top:6px}
.pg .wmi .vlt td,.pg .wmi .vlt th{font-size:11.13px}
.pg .dvc td.v small{color:#666;font-size:9.2px;font-weight:400}
.pg .dvc td,.pg .dvc th{font-size:10.91px}
/* v3 readable print (min ≈ 9.5px / 7pt; no page scaling) */
.pg .wmd,.pg .roomy .wmd{width:320px}
.pg .wmr{gap:16px;align-items:center}
.pg .lgd2{margin-top:10px;gap:4px 12px}
.pg .lgd2 .lgi{font-size:10.7px;gap:6px}
.pg .lgd2 .lgi i{width:16px;height:11px}
.pg .abbr,.pg .roomy .abbr{font-size:10.17px}
.pg td small{font-size:10.17px}
.pg .ex{font-size:10.7px}
.pg .pn{font-size:10.17px}
.pg .ent{font-size:10.7px}
.pg .dvt th{font-size:11.24px}
.pg .roomy .dvt td{font-size:11.77px}
/* v3.1 compact rows, same font sizes */
.pg .roomy .mtb td{padding:1.6px 5px}
.pg .roomy .mtb th{padding:2px 5px}
.pg .roomy .pt td{padding:1.8px 6px}
.pg .roomy .vlt td{padding:2px 5px}
.pg .wmd,.pg .roomy .wmd{width:290px}
.pg .wmr{align-items:flex-start}
.pg .lgdB{margin-top:6px;gap:3px 8px}
.pg .lgdB .lgi{font-size:10.17px;gap:4px}
.pg .lgdB .lgi i{width:14px;height:10px}
.pg .wmi .sec{margin-top:8px}
.pg .lgdT{margin:0 0 6px}
/* v3.2: bull's-eye 10% smaller */
.pg .wmd,.pg .roomy .wmd{width:261px}
/* v3.3 tighter line spacing (font size unchanged) */
.pg .roomy .cm li{line-height:1.3;margin:0}
.pg .cm .sub{margin:2px 0 0}
.pg .sh{margin:5px 0 3px}
.pg .sig{margin-top:4px}
.pg .sig .line{margin-top:18px}
/* tight fallback: line spacing only (no font change) when 1 extra page would be needed */
.pg .roomy.tight .cm li{line-height:1.22;margin:0}
.pg .roomy.tight .imp li{margin:0}
.pg .roomy.tight .sh{margin:6px 0 3px}
.pg .roomy.tight .lh{margin:5px 0 3px}
.pg .roomy.tight .sec{margin-top:3px}
.pg .roomy.tight .vt{margin-bottom:4px}
/* auto-filled half of a velocity ↔ PG pair */
input.acv{color:#0b7a55;font-style:italic;background:#f1faf5}
/* ===== Black & white (laser) print ===== */
.pg.bw, .pg.bw *{color:#000 !important}
.pg.bw th, .pg.bw .cap1, .pg.bw td.nf, .pg.bw .sh{background:none !important}
.pg.bw table, .pg.bw th, .pg.bw td{border-color:#555 !important}
.pg.bw th, .pg.bw .cap1{border-bottom:1.5px solid #000 !important}
.pg.bw .sh{border-left:4px solid #000 !important;border-bottom:1.2px solid #000;padding:1px 7px}
.pg.bw td.a, .pg.bw td.v.a{font-weight:800}
.pg.bw .rt{letter-spacing:.8px}
.pg.bw .abbr{border-top-color:#000}
.pg.bw .wmk{color:rgba(0,0,0,.07) !important}
.pg.bw .lgbw .lgi{display:flex;align-items:center;gap:5px}
.pg.bw .lgbw .lgi svg{flex:none}
/* B&W: normal values regular, abnormal values heavy + grey box so they stand out without colour */
.pg.bw .mtb td.v, .pg.bw .dvc td.v, .pg.bw .vt td:not(.n){font-weight:400}
.pg.bw td.a, .pg.bw td.v.a, .pg.bw .vlt td.a{font-weight:800 !important;background:#e6e6e6 !important}
/* abnormal clauses in findings */
.pg .cm .abx{color:#b3261e;font-weight:700}
.pg.bw .cm .abx{font-weight:800}

#gBar{position:fixed;left:8px;right:8px;bottom:10px;z-index:60;display:none}
#gBar.on{display:block}
#gBar .gIn{background:#fff8e6;border:2px solid #e0a106;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.25);padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:14px;max-width:760px;margin:0 auto}

.gFlash{animation:gF 1.6s ease 2;outline:3px solid #e0a106;outline-offset:3px;border-radius:8px}

  const v2 = (o.eep!=null&&o.eep>=14)||(es!=null&&o.elat==null&&es>=15)||(el!=null&&o.esep==null&&el>=13);

  // others
  { const pl=phLine(); if(pl) oth.push(pl); }
  if(F.peri.o!=='Pericardium is normal' && !/Large/.test(F.peri.o)) oth.push(F.peri.o);

  if(rvBad) ch.push(`Reduced RV systolic function${rvq.length?` (${rvq.join(', ')})`:''}${rep.rvwm!==RVWM[0]?' — '+lc(rep.rvwm).replace(/\.$/,''):''}`);
  if(/Hypertrophied/.test(F.rv.o)) wt.push('RV hypertrophy');
  const lvOK = !e || e.g==='Normal', bl = e && e.g==='Borderline low';
  let last='';

  else if(!e) last=rvBad?'':'';
  else if(lvOK && !rvBad) last=`Normal LV & RV systolic function (LVEF ${e.ef}%)`;
  else if(lvOK) last=`Normal LV systolic function (LVEF ${e.ef}%)`;
  else if(!rvBad) last='Normal RV systolic function';
  const body=[...crit,...prim,...rw,...rhy,...ch,...wt,...dia,...minor,...oth];
  const abnormal = [...crit,...prim,...rw,...rhy,...ch,...wt,...dia,...oth, ...minor.filter(x=>x!=='Normal cardiac valves'), ...(bl?['bl']:[])];

  if(!wmAbn() && (rep.status||'').trim()) body.splice(crit.length+prim.length,0,'No regional wall motion abnormality at rest');
  return [...body,last].filter(Boolean).join('\n');
}

    4:`<path d="M0 3H6" stroke="#000" stroke-width="1.2"/>`,

}

function bullseye(interactive){
  const cx=210, cy=210; let s='';

    if(ring==='x'){ s+=`<circle cx="${cx}" cy="${cy}" r="${R.x[1]}" fill="${fill}" stroke="#111" stroke-width="2"${attr}/>`; }
    else { const half=ring==='a'?45:30; s+=`<path d="${sector(cx,cy,R[ring][0],R[ring][1],ang-half,ang+half)}" fill="${fill}" stroke="#111" stroke-width="2"${attr}/>`; }

    const rMid=(R[ring][0]+R[ring][1])/2, [x,y]=pt(cx,cy,rMid,ang);
    let rot=90-ang; while(rot>90) rot-=180; while(rot<-90) rot+=180;
    const fs=interactive?(ring==='b'?9.5:ring==='m'?9:8):(ring==='b'?14.5:13.8);
    s+=`<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot})" pointer-events="none"><text y="-2" font-size="${fs}" font-weight="700" text-anchor="middle" fill="${col}"${halo} font-family="Arial">${words[0]}</text><text y="${fs+0.5}" font-size="${fs}" font-weight="700" text-anchor="middle" fill="${col}"${halo} font-family="Arial">${words.slice(1).join(' ')}</text>${interactive?`<text y="${2*fs+2}" font-size="${fs-1}" text-anchor="middle" fill="${col}" opacity=".55" font-family="Arial">${n}</text>`:''}</g>`;
  });

}

function dxSuggest(){
  if((rep.dx||'').trim()) return null; const e=efInfo();
  if(/PCI|CABG/i.test(rep.status||'') && wmAbn() && e && !['Normal','Borderline low'].includes(e.g)) return 'Ischaemic cardiomyopathy';
  if(rep.wm.every(x=>x===1) && (rep.f.lv.o==='Dilated'||/dilated/i.test(geom())) && e && /reduced/.test(e.g) && !/PCI|CABG/i.test(rep.status||'')) return 'Dilated cardiomyopathy';
  return null;
}

function checks(){
  const W=[], V=rep.v;
  if(!rep.sex) W.push('Sex is not selected — normal ranges use male values.');
  if(ageYears()==null) W.push('Age is not entered.');
  if(isPed() && !pnum(rep.wt)) W.push('Child: weight is needed for z-score normal ranges.');
  if(!efInfo()) W.push('No LVEF — tap an EF band or enter LVIDd/LVIDs.');
  if(wmAbn() && !rep.efBand && C.efs==null) W.push('RWMA present: Teichholz EF is unreliable — tap an EF band (visual / biplane).');
  { const lvM=C.lvmi!=null||C.rwt!=null||C.lvidd!=null, g=lvM?geom():'', lo=rep.f.lv.o, T=rep.tplSet||{};
    const laD=MM.find(d=>d.id==='la');
    if(T.lv && lvM && !isPed() && rep.f.lv.o==='Normal size & wall thickness' && ((/hypertroph/i.test(T.lv)&&!/hypertroph/i.test(g)) || (T.lv==='Dilated'&&!/dilat/i.test(g)) || (/remodel/i.test(T.lv)&&!/remodel/i.test(g))))
      W.push(`Template said "LV ${T.lv.toLowerCase()}", but the measurements show: ${g||'normal LV geometry'}. The measurement is used (Skip if that is right, or choose the LV finding manually).`);
    if(lvM && !isPed() && /hypertrophy/.test(lo) && !/hypertroph/i.test(g)) W.push(`LV marked "${lo.toLowerCase()}" but measurements do not show LVH (${g||`IVSd ${mtxt('ivsd')}, LVPWd ${mtxt('lvpwd')} mm`}). Check the LV finding or the wall measurements.`);
    if(lvM && !isPed() && lo==='Dilated' && C.lvidd!=null && C.lvidd<=rng(MM.find(d=>d.id==='lvidd').hi)) W.push(`LV marked "dilated" but LVIDd ${mtxt('lvidd')} mm is within normal limits. Check the LV finding.`);
    if(T.la && C.la!=null && rep.f.la.o==='Normal size' && !flag(laD)) W.push(`Template said "LA dilated", but LA ${mtxt('la')} mm is normal — the measurement is used.`);
    if(!isPed() && rep.f.la.o==='Dilated' && C.la!=null && !flag(laD) && !T.la) W.push(`LA marked "dilated" but LA ${mtxt('la')} mm is within normal limits. Check the LA finding.`);
    if(rep.ddAuto===false){ const a=ddAutoVal(); if(a && a!==rep.f.dd.o) W.push(`Diastolic function set to "${rep.f.dd.o}" but the measurements suggest "${a}". Check the diastolic grade.`); }
  }
  VALVES.forEach(x=>{ const P=stenParts(x.k).filter(p=>p[1]>0||stenParts(x.k).some(q=>q[1]>0)); if(P.length>1 && new Set(P.map(p=>p[1])).size>1) W.push(`${x.ab}S grading discordant: ${P.map(p=>`${p[2]} → ${SEVN[p[1]]}`).join('; ')}. Check SVi / low-flow state and measurements.`); });
  ['mv','av'].forEach(k=>{ const sg=suggest(k); if(sg && V[k].stAuto===false && V[k].st!==sg.g) W.push(`${k==='mv'?'MS':'AS'} grade "${V[k].st}" differs from the numbers (${sg.why} → ${sg.g}).`); });
  if(V.mv.st!=='None' && C.mvarea==null && C.mvapht==null) W.push('MS selected but MVA is not entered.');
  if(C.trvE!=null && V.tv.rg==='None') W.push('TR velocity is entered but TR is "None".');
  if(V.tv.rg!=='None' && C.rvsp==null) W.push('TR is present — enter TR peak velocity, TR PG or PASP (PASP and PH grade must be reported).');
  if(/LA \/ LAA thrombus/.test(rep.f.mass.o) && /^Suitable/.test(rep.vd.ms.ptmc)) W.push('LA / LAA thrombus with "Suitable for PTMC".');
  { const d=ddSuggest(); if(d&&d.g&&d.g!=='Indeterminate'&&rep.f.dd.o!==d.g) W.push(`Diastolic function "${rep.f.dd.o}" differs from the ASE 2025 suggestion (${d.g}).`); }
  if(V.av.st!=='None' && C.svi!=null && C.svi<35 && (!rep.vd.as.flow||rep.vd.as.flow==='Normal flow')) W.push(`AS with SVi ${C.svi.toFixed(0)} ml/m² (<35): consider a low-flow state.`);
  if(rep.tpl && C.lvidd==null && !rep.efBand) W.push(`Template "${rep.tpl}" applied but measurements are empty.`);
  if(isPed() && pnum(rep.wt) && ageYears()<0.1 && pnum(rep.wt)<2.5) W.push('Low birth weight: PHN z-scores were derived from term babies — interpret with caution.');
  return W;
}

// two balanced columns: sections flow left→right and may continue in the next column
function measTables(){
  const secs=[['M-MODE & 2D MEASUREMENTS',MM.filter(d=>d.g==='m').filter(printRow).map(rowHTML)],
              ['LV FUNCTION',[efRow(),...MM.filter(d=>d.g==='f').filter(printRow).map(rowHTML)].filter(Boolean)],
              ['GREAT VESSELS',MM.filter(d=>d.g==='v').filter(printRow).map(rowHTML)],
              ['HAEMODYNAMICS',DD.filter(d=>d.g==='h').filter(printRow).map(rowHTML)]].filter(x=>x[1].length);
  if(!secs.length) return '';
  const HDR=2.2, total=secs.reduce((a,[,r])=>a+HDR+r.length,0), half=total/2;
  const cols=[[],[]]; let used=0, ci=0;
  const tbl=(t,rows)=>`<table class="mtb"><tr><td colspan="3" class="cap1">${t}</td></tr><tr><th>Parameter</th><th style="text-align:right">Value</th><th>Normal</th></tr>${rows.join('')}</table>`;
  secs.forEach(([t,rows])=>{
    let r=rows.slice(), first=true;
    while(r.length){
      if(ci===0){ const room=Math.floor(half-used-HDR+0.5);
        if(room>=2 && room<r.length && r.length-room>=2){ cols[0].push(tbl(t+(first?'':' (contd.)'),r.slice(0,room))); r=r.slice(room); used=half; ci=1; first=false; continue; }
        if(room<2 && used>0){ ci=1; continue; }
        cols[0].push(tbl(t+(first?'':' (contd.)'),r)); used+=HDR+r.length; r=[]; if(used>=half) ci=1; }
      else { cols[1].push(tbl(t+(first?'':' (contd.)'),r)); r=[]; }
    }
  });
  return `<div class="cols2 sec"><div>${cols[0].join('')}</div><div>${cols[1].join('')}</div></div>`;
}

function buildPages1(RC){

  const mBlocks=[headerHTML()+patientHTML(), measTables(), wallMotionHTML(), dopplerHTML('flow')].filter(Boolean);
  const fBlocks=[...findingsBlocks(), `<div class="sec">${impressionBlock()}</div>${sigHTML()}`, abbrHTML()].filter(Boolean);
  const pages=[]; let cur='', hasCont=false;
  const fits=h=>measure('<div class="'+RC+'">'+h+'</div>')<=inner;
  const newPage=()=>{ if(cur) pages.push(cur); cur=contHead(); hasCont=true; };
  mBlocks.forEach((bk,i)=>{ if(i===0){ cur=bk; return; } if(fits(cur+bk)) cur+=bk; else { newPage(); cur+=bk; } });

  if(!hasCont) newPage(); else cur+='<div class="sec"></div>';

    const up=(title,mime,txt)=>driveCreate(gd,{title,parentId:P,contentMimeType:mime,textContent:txt,disableConversionToGoogleType:true});
    await up(`Echo_backup_${B.stamp}_${B.n}reports.json`,'application/json',B.jsonTxt);
    await up(`Echo_reports_list_${B.stamp}.csv`,'text/csv',B.csvTxt);
    const v=appVer(); let appUp=false;
    if(settings.driveAppVer!==v){ await up(`Echo_Report_App_${B.stamp}.html`,'text/html',SELF_HTML); settings.driveAppVer=v; appUp=true; }
    settings.lastDrive=Date.now(); settings.lastBackup=Date.now(); saveSettings();

async function restoreBackup(file){
  try{
    const j=JSON.parse(await file.text());
    if(!j||j.app!=='echo-report'||!Array.isArray(j.reports)) throw {message:'not an echo backup file'};
    const have=new Set((await listReports()).map(r=>r.id)); let add=0, skip=0;
    for(const r of j.reports){ if(!r||!r.id||have.has(r.id)){ skip++; continue; }
      const doc=Object.assign({},r); delete doc.id;
      if(store.mode==='db') await rColl().doc(r.id).set(doc); else { const m=LS.get('echo_reports',{}); m[r.id]=doc; LS.set('echo_reports',m); }
      const x=String(r.rno||'').match(/^(ECHO-\d{6}-)(\d+)$/); if(x){ settings.rseq=Object.assign({},settings.rseq||{}); settings.rseq[x[1]]=Math.max(settings.rseq[x[1]]||0,+x[2]); }
      add++; }
    saveSettings(); toast(`Restored ✓ ${add} added, ${skip} already present`); renderSaved();
  }catch(e){ toast('Restore failed: '+(e.message||e.code||'')); }
}

  [/^Sex/, '[data-g="sex"]'], [/^Age/, '[data-g="ageN"]'], [/weight|birth weight/i, '[data-g="wt"]'],
  [/LVEF|EF band|Teichholz/, '.efb'], [/^AS|AS grading|AS with SVi/, '[data-vc="av"]'],
  [/^MS|MS grading/, '[data-vc="mv"] input[data-m="mvarea"]|[data-vc="mv"]'], [/^TS/, '[data-vc="tv"]'], [/^PS/, '[data-vc="pv"]'],
  [/TR /, '[data-vc="tv"] input[data-m="trv"]|[data-vc="tv"]'], [/thrombus/i, '[data-f="mass.o"]'], [/Diastolic/, '#ddSug'],
  [/LV marked|Template said "LV/, '[data-f="lv.o"]'], [/LA marked|Template said "LA/, '[data-f="la.o"]'], [/Diastolic function set/, '#ddSug'],
  [/Template/, '[data-mr="ivsd"]']];
function chkTarget(w){ for(const [re,sel] of CHK_T){ if(re.test(w)){ for(const q of sel.split('|')){ const el=document.querySelector(q); if(el) return el; } } } return null; }
let guide=null; // {skip:Set}
function guideOpen(skip){ guide={skip:new Set(skip||[])}; showTab('pForm'); guideStep(); }
function guideList(){ return checks().filter(w=>!guide.skip.has(w)); }
function guideStep(){
  if(!guide) return;
  let bar=document.getElementById('gBar');
  if(!bar){ bar=document.createElement('div'); bar.id='gBar'; document.body.appendChild(bar);
    bar.onclick=e=>{ const b=e.target.closest('button'); if(!b) return;
      if(b.dataset.g==='skip'){ guide.skip.add(guide.cur); guideStep(); }
      else if(b.dataset.g==='go'){ const t=chkTarget(guide.cur); if(t) flashTo(t); }
      else if(b.dataset.g==='pdf'){ guideClose(); makePdf(); }
      else if(b.dataset.g==='x'){ guideClose(); } }; }
  const L=guideList(), all=checks().length;
  if(!L.length){ guide.cur=null; bar.innerHTML=`<div class="gIn ok"><b>✓ ${all?'Remaining items skipped':'All fixed'}</b><span class="sp"></span><button class="mini pri" data-g="pdf">⬇ Make PDF</button><button class="mini" data-g="x">✕</button></div>`; bar.classList.add('on'); return; }
  const w=L[0], moved=guide.cur!==w; guide.cur=w;
  bar.innerHTML=`<div class="gIn"><div class="gT"><b>⚠ ${L.length} left</b> — ${esc(w)}</div><div class="gB"><button class="mini" data-g="go">📍 Show</button><button class="mini" data-g="skip">Skip ›</button><button class="mini pri" data-g="pdf">PDF anyway</button><button class="mini" data-g="x">✕</button></div></div>`;
  bar.classList.add('on');
  if(moved){ const t=chkTarget(w); if(t) flashTo(t); }
}
function guideClose(){ guide=null; const b=document.getElementById('gBar'); if(b) b.classList.remove('on'); }
function flashTo(el){ const card=el.closest('.card')||el; el.scrollIntoView({behavior:'smooth',block:'center'}); el.classList.remove('gFlash'); void el.offsetWidth; el.classList.add('gFlash'); setTimeout(()=>el.classList.remove('gFlash'),3400); const f=el.matches('input,select,textarea')?el:el.querySelector('input,select'); if(f&&!f.readOnly) setTimeout(()=>{ try{ f.focus({preventScroll:true}); }catch(e){} },450); }
function askPdf(){
  const W=checks();
  if(!W.length) return makePdf();
  let m=document.getElementById('pdfAsk');
  if(!m){ m=document.createElement('div'); m.id='pdfAsk'; m.className='dlg'; document.body.appendChild(m); }
  m.innerHTML=`<div class="dlgc"><b>⚠ ${W.length} item${W.length>1?'s':''} to check</b><ul>${W.map(w=>`<li>${esc(w)}</li>`).join('')}</ul>
   <div style="display:flex;gap:8px;justify-content:flex-end"><button class="mini" data-x="fix">🧭 Fix one by one</button><button class="mini pri" data-x="go">Make PDF anyway</button></div></div>`;
  m.classList.add('on');
  m.onclick=e=>{ const b=e.target.closest('button'); if(!b) return; m.classList.remove('on'); if(b.dataset.x==='go') makePdf(); else guideOpen(); };
}
/* ================= AUTOCOMPLETE ================= */
const AC={box:null,el:null,start:0,end:0,items:[],sel:0};
function acLib(){ const own=Array.isArray(settings.phrases)?settings.phrases:[]; return [...own,...PHRASES.filter(p=>!own.includes(p))]; }
function acFrag(el){ const v=el.value, c=el.selectionStart==null?v.length:el.selectionStart; let i=c; while(i>0 && !/[;,.\n(]/.test(v[i-1])) i--; while(i<c && v[i]===' ') i++; return {start:i,end:c,frag:v.slice(i,c)}; }
function acShow(el){
  const {start,end,frag}=acFrag(el); const q=frag.trim().toLowerCase();
  if(q.length<2){ acHide(); return; }
  const lib=acLib();
  const hits=lib.filter(p=>{ const l=p.toLowerCase(); return l!==q && (l.startsWith(q) || l.split(/[\s/(—-]+/).some(w=>w.startsWith(q)) || (q.length>=4 && l.includes(q))); })
    .sort((a,b)=>(b.toLowerCase().startsWith(q)?1:0)-(a.toLowerCase().startsWith(q)?1:0)).slice(0,6);
  if(!hits.length){ acHide(); return; }
  if(!AC.box){ AC.box=document.createElement('div'); AC.box.className='acbox'; document.body.appendChild(AC.box);
    AC.box.addEventListener('pointerdown',e=>{ const it=e.target.closest('[data-i]'); if(!it) return; e.preventDefault(); acPick(+it.dataset.i); }); }
  Object.assign(AC,{el,start,end,items:hits,sel:0});
  AC.box.innerHTML=hits.map((h,i)=>{ const l=h.toLowerCase(), k=l.indexOf(q); return `<div data-i="${i}" class="${i===0?'on':''}">${k>=0?esc(h.slice(0,k))+'<b>'+esc(h.slice(k,k+q.length))+'</b>'+esc(h.slice(k+q.length)):esc(h)}</div>`; }).join('');
  const r=el.getBoundingClientRect();
  AC.box.style.left=Math.max(4,r.left)+'px'; AC.box.style.width=Math.min(window.innerWidth-8,Math.max(r.width,260))+'px';
  AC.box.style.top=(r.bottom+4)+'px'; AC.box.style.display='block';
}
function acHide(){ if(AC.box) AC.box.style.display='none'; AC.items=[]; }
function acPick(i){ const el=AC.el, p=AC.items[i]; if(!el||!p) return; const v=el.value;
  el.value=v.slice(0,AC.start)+p+v.slice(AC.end); const pos=AC.start+p.length; try{ el.setSelectionRange(pos,pos); }catch(e){}
  acHide(); el.dispatchEvent(new Event('input',{bubbles:true})); el.focus(); }
function acLearn(el){ if(!el||!el.hasAttribute('data-ac')) return;
  const segs=el.value.split(/[;\n]/).map(x=>x.trim().replace(/\.$/,'')).filter(x=>x.length>=12&&x.length<=90);
  if(!segs.length) return; const own=Array.isArray(settings.phrases)?settings.phrases:[]; let add=0;
  segs.forEach(x=>{ if(!acLib().some(p=>p.toLowerCase()===x.toLowerCase())){ own.unshift(x); add++; } });
  if(add){ settings.phrases=own.slice(0,300); saveSettings(); } }
document.addEventListener('input',e=>{ const t=e.target; if(t && t.hasAttribute && t.hasAttribute('data-ac') && !t.readOnly) acShow(t); else acHide(); },true);
document.addEventListener('keydown',e=>{ if(!AC.items.length||!AC.box||AC.box.style.display==='none') return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); AC.sel=(AC.sel+(e.key==='ArrowDown'?1:AC.items.length-1))%AC.items.length; [...AC.box.children].forEach((c,i)=>c.classList.toggle('on',i===AC.sel)); }
  else if(e.key==='Enter'||e.key==='Tab'){ e.preventDefault(); acPick(AC.sel); } else if(e.key==='Escape') acHide(); },true);
document.addEventListener('focusout',e=>{ setTimeout(acHide,150); acLearn(e.target); },true);
window.addEventListener('scroll',()=>{ if(AC.box&&AC.box.style.display==='block'&&AC.el){ const r=AC.el.getBoundingClientRect(); if(r.bottom<0||r.top>window.innerHeight) acHide(); else AC.box.style.top=(r.bottom+4)+'px'; } },true);

/* ================= INIT ================= */
(function(){
  const s=LS.get('echo_settings',null); if(s) settings=Object.assign(settings,s); if(fixDoc()) LS.set('echo_settings',settings);
  const d=LS.get('echo_draft',null); if(d&&d.rep){ try{ rep=migrate(d.rep); }catch(e){} }
  syncAuto(); renderForm();
  const wide=window.matchMedia('(min-width:1100px)').matches;
  if(wide) showTab('pForm');
  initStore();
})();

</script>
